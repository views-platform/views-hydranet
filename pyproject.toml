[project]
name = "views-hydranet"
version = "0.1.0"
description = "views-hydranet is a package that contains modeling procedure, evaluation and forecasting using HydraNet implemented in PyTorch"
authors = [
    {name = "Dylan",email = "52908667+smellycloud@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "views-pipeline-core (>=3.0.0,<4.0.0)",
    "torch>=2.2.1,<3.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# INTERIM (pending views-pipeline-core 3.0.0 on PyPI): source pipeline-core from its
# development branch over git so this development branch tracks the unreleased 3.x in
# tandem with the other consumers. Remove this override once 3.0.0 is published.
[tool.poetry.dependencies]
views-pipeline-core = { git = "https://github.com/views-platform/views-pipeline-core.git", branch = "development" }

[tool.poetry.group.dev.dependencies]
ruff = ">=0.14.14,<0.15.0"
mypy = ">=1.19.1,<2.0.0"
pytest = ">=9.0.3,<10.0.0"
pre-commit = ">=4.5.1,<5.0.0"
pytest-cov = ">=5.0.0,<6.0.0"


[tool.ruff]
line-length = 99

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle errors (E) & warnings (W), and isort (I)
select = ["E", "F", "W", "I"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

[tool.mypy]
# Ignore errors from libraries that don't have type hints
ignore_missing_imports = true
