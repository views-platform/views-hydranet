[project]
name = "views-hydranet"
version = "0.1.3"
description = "views-hydranet is a package that contains modeling procedure, evaluation and forecasting using HydraNet implemented in PyTorch"
authors = [
    {name = "Dylan",email = "52908667+smellycloud@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "views-pipeline-core (>=3.0.0,<4.0.0)",
    "views-frames (>=1.10.2,<2)",
    "torch>=2.2.1,<3.0.0",
    # Imported at five sites (training_engine.py, utils.py: `wandb.run`, `wandb.log`). Until
    # 2026-09-19 it was undeclared and arrived only through views-pipeline-core's pin (#381).
    # Range matches views-pipeline-core 3.3.0's; the two names we use exist unchanged on 0.30.0.
    "wandb>=0.18.7,<1.0",
    # ⛔ UNDECLARED until 2026-10-20 — the #381 defect a second time, and it shipped in 0.1.0
    # through 0.1.3. pandas is imported at module top by SEVEN production modules and is on the
    # production path for EVERY run type: `manager/hydranet_manager.py:152` calls
    # `VolumeHandler.from_df(df, ...)`, so a training, evaluation or forecast run cannot start
    # without it.
    #   utils/data_sniffer.py        pd.api.types, pd.DataFrame, pd.MultiIndex
    #   utils/data_fetcher.py        pd.DataFrame, pd.MultiIndex
    #   utils/volume_handler.py      pd.DataFrame
    #   utils/feature_scaler.py      pd.api.types, pd.DataFrame
    #   utils/utils_logging.py       pd.DataFrame
    #   manager/hydranet_manager.py  pd.DataFrame
    #   utils/visual_diagnostics.py  pd.DataFrame, pd.MultiIndex  (viz extra, never headless)
    #
    # ⚠️ Why a bare `import views_hydranet` did not catch it: `__init__.py`'s PEP 562 lazy
    # `__getattr__` means pandas is not loaded until `HydranetManager` is touched. So an import
    # smoke test passes and only a real run fails — which is how this reached PyPI four times.
    #
    # Range MATCHED to views-pipeline-core's `pandas = ">=1.5.3,<3.0"`, deliberately not
    # invented: that package documents the floor (the `pandas <2.0` ecosystem lock across eight
    # views-* packages, #308) and the ceiling (pandas-1 pickles in model caches are untested
    # against pandas 3). We use only `pd.DataFrame`, `pd.MultiIndex` and `pd.api.types`, so our
    # own needs bind nothing — the ecosystem does. Locked here at 1.5.3.
    #
    # ⚠️ This DECLARES the dependency; it does not remove it. Removal is proposed ADR-072 and
    # planned in `reports/2026-08-13_frame_native_input_dossier/` (PF-0 there is this change,
    # deliberately separable so honesty does not wait on the migration).
    "pandas>=1.5.3,<3.0"
]

# issue #215: matplotlib is imported lazily by VisualDiagnostics (optional plotting stack). Declare it
# as an OPTIONAL extra so models that enable diagnostics (diagnostic_visualizations=True) can pin it via
# `views-hydranet[viz]`; the default headless run path needs no plotting stack.
[project.urls]
Homepage = "https://github.com/views-platform/views-hydranet"
Repository = "https://github.com/views-platform/views-hydranet"
Issues = "https://github.com/views-platform/views-hydranet/issues"
Changelog = "https://github.com/views-platform/views-hydranet/releases"

[project.optional-dependencies]
viz = ["matplotlib>=3.8,<4"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.14.14,<0.15.0"
mypy = ">=1.19.1,<2.0.0"
pytest = "<9.0.0"
pre-commit = ">=4.5.1,<5.0.0"
pytest-cov = ">=5.0.0,<6.0.0"
# #215: the test suite renders diagnostics + imports matplotlib at module top (test_visual_diagnostics,
# test_memory_fingerprint), and conftest fails the run if collection drops below the min count — so
# matplotlib must be present in the test env even though it's a runtime-optional 'viz' extra.
matplotlib = ">=3.8,<4"


[tool.ruff]
line-length = 99

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle errors (E) & warnings (W), and isort (I)
select = ["E", "F", "W", "I"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

[tool.mypy]
# Ignore errors from libraries that don't have type hints
ignore_missing_imports = true
