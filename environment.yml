# Conda environment for the GitHub Actions `test` job (ci.yml: environment-file: environment.yml).
#
# The whole views-platform stack (views-pipeline-core, views-frames, torch) is distributed via PyPI,
# not conda, so this env provides only python + pip and defers dependency resolution to
# `pip install .` (which reads pyproject.toml's dependencies).
#
# RESOLVED (C-165, verified 2026-10-11): this file used to carry a note saying the `test` job was
# RELEASE-BLOCKED because pyproject requires `views-pipeline-core >=3.0.0` while PyPI published only
# up to 2.3.0. That note predicted it would "go green with NO change here the moment 3.0.0 ships".
# It shipped. PyPI now serves views-pipeline-core up to 3.3.4, `pip install .` resolves end to end
# (views_pipeline_core-3.3.4, views-frames-1.11.0, views_evaluation-2.0.0), and the `test` job has
# been passing — CI run 36521544063 (main, 2026-09-29): test success, build success, lint success.
# The note was left asserting a blocker that no longer existed, which is the C-303 shape (prose
# describing a state the system does not have); it is removed rather than reworded.
name: views-hydranet-env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # `.[viz]`, not `.` — matplotlib is a runtime-OPTIONAL extra (pyproject's `viz`) and
      # `tests/test_visual_diagnostics.py` / `test_memory_fingerprint.py` import it at module
      # top, so without the extra the `test` job's collection depends on matplotlib arriving by
      # accident. It does: `pyod` (views-pipeline-core -> viewser -> pyod) pulls it in UNPINNED.
      # That is the same accidental-guarantor class as the four dependencies declared on
      # 2026-10-20 — green only because somebody else's transitive choice happened to cover us.
      # Closes HALF of C-285, whose Trigger is literally "adding a test that imports
      # matplotlib": the same class as C-283, which fixed the missing `ruff` binary in this
      # same list. C-285's OTHER half is untouched — ruff is still pinned independently here,
      # in pyproject's dev group and in ci.yml's lint job, so the two jobs can still disagree
      # about what "clean" means. Not fixed here (one source of truth for the test environment
      # is a repo-wide change); the register entry stays open and its Location line is stale
      # (it cites a `pyproject.toml:33-36` test extra that is now the dev group + `viz`).
      - .[viz]
      - pytest
      - pytest-cov
      # tests/test_falsification_repo_clean.py shells out to the `ruff` BINARY
      # (TestF4_02_LintViolations, TestF4_03_DeadCode). pyproject declares ruff only in the
      # poetry dev group, which `pip install .` does not install — so those three tests died
      # with `FileNotFoundError: 'ruff'` in every CI test run, independently of the code under
      # test. Pinned to the same version ci.yml's lint job installs, so the two jobs cannot
      # disagree about what "clean" means (the version-drift trap that pin was added for).
      - ruff==0.14.14
